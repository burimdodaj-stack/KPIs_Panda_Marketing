<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split View Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f13;
      --surface: #16181f;
      --border: #2a2d38;
      --accent: #5af0b4;
      --accent2: #ff6b6b;
      --text: #e8eaf0;
      --muted: #6b7080;
      --header-h: 52px;
      --tab-h: 40px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      white-space: nowrap;
    }

    .dot { color: var(--accent2); }

    .status-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill {
      font-size: 0.65rem;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .pill.live::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 5px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── LAYOUT ── */
    .workspace {
      height: calc(100vh - var(--header-h));
      display: flex;
      flex-direction: row;
      gap: 0;
    }

    /* ── PANELS ── */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
      position: relative;
    }

    .panel:last-child { border-right: none; }

    /* ── DIVIDER (desktop) ── */
    .divider {
      width: 4px;
      background: var(--border);
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.2s;
      position: relative;
    }

    .divider:hover, .divider.dragging { background: var(--accent); }

    .divider::after {
      content: '⋮⋮';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: -2px;
      pointer-events: none;
    }

    /* ── TAB BAR ── */
    .tab-bar {
      height: var(--tab-h);
      display: flex;
      align-items: stretch;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 12px;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      font-size: 0.7rem;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      transition: color 0.2s;
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .tab-icon {
      width: 14px; height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .panel:nth-child(1) .tab.active { border-bottom-color: var(--accent); }
    .panel:nth-child(3) .tab.active { border-bottom-color: var(--accent2); }

    /* ── TOOLBAR ── */
    .toolbar {
      height: 34px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .url-bar {
      flex: 1;
      height: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .url-bar span { color: var(--text); opacity: 0.5; flex-shrink: 0; }

    .btn-icon {
      width: 22px; height: 22px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 0.65rem;
      color: var(--muted);
      flex-shrink: 0;
      transition: color 0.15s, border-color 0.15s;
      text-decoration: none;
    }

    .btn-icon:hover { color: var(--text); border-color: var(--accent); }

    /* ── IFRAME WRAPPER ── */
    .iframe-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    /* loading overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .panel:nth-child(3) .spinner { border-top-color: var(--accent2); }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 0.65rem; color: var(--muted); }

    /* ── MOBILE TABS (bottom nav) ── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .mobile-nav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.55rem;
      transition: color 0.2s;
      padding: 6px 0;
    }

    .mobile-nav button.active { color: var(--accent); }
    .mobile-nav button:last-child.active { color: var(--accent2); }

    .m-icon { font-size: 1.1rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      html, body { overflow: auto; }

      .workspace {
        flex-direction: column;
        height: auto;
        min-height: calc(100vh - var(--header-h) - 52px);
      }

      .divider { display: none; }

      .panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
        height: calc(100vh - var(--header-h) - 52px);
        flex: none;
        display: none;
      }

      .panel.mobile-active { display: flex; }

      .mobile-nav { display: flex; }

      .tab { max-width: 160px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">split<span class="dot">.</span>view</div>
  <div class="status-row">
    <div class="pill live">live</div>
    <div class="pill">2 panels</div>
  </div>
</header>

<div class="workspace" id="workspace">

  <!-- PANEL LEFT -->
  <div class="panel mobile-active" id="panel-left">
    <div class="tab-bar">
      <div class="tab active">
        <img class="tab-icon" src="https://ssl.gstatic.com/docs/spreadsheets/favicon3.ico" alt="" />
        Google Sheets — Report
      </div>
    </div>
    <div class="toolbar">
      <a class="btn-icon" href="https://docs.google.com/spreadsheets/u/3/d/e/2PACX-1vTNx5KCMaGnTYMYQtSlUTCWYL8GspBS6R71EeVl1wfXL4hIsGpSf16z5EhyVzzf-j74G8db9Mr7VIG2/pubhtml?gid=1855366887&single=true" target="_blank" title="In neuem Tab öffnen">↗</a>
      <div class="url-bar"><span>🔒</span> docs.google.com › spreadsheets › pubhtml</div>
    </div>
    <div class="iframe-wrap">
      <div class="loading-overlay" id="load-left">
        <div class="spinner"></div>
        <div class="loading-text">Lade Tabelle…</div>
      </div>
      <iframe
        id="frame-left"
        src="https://docs.google.com/spreadsheets/u/3/d/e/2PACX-1vTNx5KCMaGnTYMYQtSlUTCWYL8GspBS6R71EeVl1wfXL4hIsGpSf16z5EhyVzzf-j74G8db9Mr7VIG2/pubhtml?gid=1855366887&single=true"
        title="Google Sheets Report"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        onload="hideLoader('load-left')"
      ></iframe>
    </div>
  </div>

  <!-- DRAG DIVIDER -->
  <div class="divider" id="divider"></div>

  <!-- PANEL RIGHT -->
  <div class="panel" id="panel-right">
    <div class="tab-bar">
      <div class="tab active">
        <img class="tab-icon" src="https://www.google.com/s2/favicons?domain=swipepages.net&sz=32" alt="" />
        Test Report
      </div>
    </div>
    <div class="toolbar">
      <a class="btn-icon" href="https://qsulplz2wwd8.swipepages.net/TestReport" target="_blank" title="In neuem Tab öffnen">↗</a>
      <div class="url-bar"><span>🔒</span> qsulplz2wwd8.swipepages.net › TestReport</div>
    </div>
    <div class="iframe-wrap">
      <div class="loading-overlay" id="load-right">
        <div class="spinner"></div>
        <div class="loading-text">Lade Seite…</div>
      </div>
      <iframe
        id="frame-right"
        src="https://qsulplz2wwd8.swipepages.net/TestReport"
        title="Test Report"
        sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
        onload="hideLoader('load-right')"
      ></iframe>
    </div>
  </div>

</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="mobile-nav" id="mobile-nav">
  <button class="active" onclick="switchPanel('left', this)">
    <span class="m-icon">📊</span>
    Tabelle
  </button>
  <button onclick="switchPanel('right', this)">
    <span class="m-icon">📋</span>
    Report
  </button>
</nav>

<script>
  /* ── Loading overlay ── */
  function hideLoader(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  }

  /* Fallback: hide after 8s */
  setTimeout(() => hideLoader('load-left'), 8000);
  setTimeout(() => hideLoader('load-right'), 8000);

  /* ── Mobile panel switch ── */
  function switchPanel(side, btn) {
    document.getElementById('panel-left').classList.remove('mobile-active');
    document.getElementById('panel-right').classList.remove('mobile-active');
    document.querySelectorAll('.mobile-nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + side).classList.add('mobile-active');
    btn.classList.add('active');
  }

  /* ── Drag-to-resize divider (desktop) ── */
  const divider = document.getElementById('divider');
  const workspace = document.getElementById('workspace');
  const panelLeft = document.getElementById('panel-left');
  const panelRight = document.getElementById('panel-right');

  let dragging = false, startX = 0, startLeft = 0, startRight = 0;

  divider.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startLeft = panelLeft.getBoundingClientRect().width;
    startRight = panelRight.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'col-resize';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const total = startLeft + startRight;
    let newLeft = Math.max(200, Math.min(total - 200, startLeft + dx));
    let newRight = total - newLeft;
    panelLeft.style.flex = 'none';
    panelRight.style.flex = 'none';
    panelLeft.style.width = newLeft + 'px';
    panelRight.style.width = newRight + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
  });
</script>
</body>
</html>
